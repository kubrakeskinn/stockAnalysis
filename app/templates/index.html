<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIST100 Canlı Takip</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-none d-md-block bg-light sidebar">
            <div class="sidebar-sticky">
                <h5 class="mt-3">Favoriler</h5>
                <ul id="favorites-list" class="list-group mb-3"></ul>
            </div>
        </nav>
        <main class="col-md-10 ms-sm-auto px-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">BIST100 Canlı Takip</h1>
            </div>
            <div class="mb-3">
                <input type="text" id="symbol-search" class="form-control" placeholder="BIST100 sembolü ara...">
                <button id="add-fav-btn" class="btn btn-primary mt-2">Favorilere Ekle</button>
            </div>
            <div>
                <canvas id="mainChart" height="100"></canvas>
            </div>
            <div class="row mt-4">
                <div class="col-md-6">
                    <canvas id="rsiChart" height="50"></canvas>
                </div>
                <div class="col-md-6">
                    <canvas id="macdChart" height="50"></canvas>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
